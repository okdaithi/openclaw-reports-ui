name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest pyflakes
      - name: Lint
        run: python -m pyflakes app.py modules tests
      - name: Test
        run: python -m pytest -q tests

  browser:
    # The interactive parts (menus, palette, map, sliders) in headless Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt pytest playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Browser tests
        env:
          RUN_BROWSER_TESTS: "1"
        run: python -m pytest -q tests/browser
