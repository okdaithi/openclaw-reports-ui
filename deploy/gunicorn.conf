# systemd drop-in: run the app under gunicorn instead of Flask's development
# server. Install with:
#   mkdir -p ~/.config/systemd/user/openclaw-reports-ui.service.d
#   cp deploy/gunicorn.conf ~/.config/systemd/user/openclaw-reports-ui.service.d/
#   systemctl --user daemon-reload && systemctl --user restart openclaw-reports-ui
# Remove the file (and daemon-reload, restart) to go back.
#
# One worker, so there is one in-memory report index; threads serve
# requests side by side. HOST and PORT come from the unit's Environment=.
[Service]
ExecStart=
ExecStart=/home/dg/openclaw-reports-ui/venv/bin/gunicorn --workers 1 --threads 8 --bind ${HOST}:${PORT} --access-logfile - app:app
